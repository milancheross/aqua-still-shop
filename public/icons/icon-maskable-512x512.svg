<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005B94" />
      <stop offset="100%" stop-color="#004570" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="0" fill="url(#bgGrad)" />

  <g transform="scale(1)">
    <!-- Droplet & Waves Graphic Symbol -->
    <g transform="translate(256, 185)">
      <!-- Water droplet silhouette -->
      <path d="M0 -75 C28 -32 58 8 58 45 C58 77 32 103 0 103 C-32 103 -58 77 -58 45 C-58 8 -28 -32 0 -75 Z" fill="#FFFFFF" opacity="0.98"/>
      <!-- Inner droplet accent -->
      <path d="M0 -42 C16 -12 34 16 34 44 C34 63 19 78 0 78 C-19 78 -34 63 -34 44 C-34 16 -16 -12 0 -42 Z" fill="#005B94" opacity="0.88"/>
      <!-- Orange core spark / energy -->
      <circle cx="0" cy="46" r="14" fill="#F37021" />
    </g>

    <!-- Bold Monogram Typography AS -->
    <text x="256" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">AS</text>

    <!-- Subtitle Brand Name -->
    <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#93C5FD" text-anchor="middle" letter-spacing="9" opacity="0.95">AQUA STILL</text>
    <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#F37021" text-anchor="middle" letter-spacing="5">ZLATIBOR</text>
  </g>
</svg>